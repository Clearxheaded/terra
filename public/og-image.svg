<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#05080d" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="terrainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />

    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- 3D Isometric Terrain Mesh Visualization (Right Half) -->
  <g transform="translate(620, 60)">
    <!-- Mountain Background Silhouette -->
    <polygon points="120,440 280,240 440,360 520,440" fill="url(#terrainGrad1)" opacity="0.3" />
    <polygon points="40,460 220,180 380,320 480,460" fill="url(#terrainGrad1)" opacity="0.5" />

    <!-- Isometric Topographic Wireframe Ridges -->
    <path d="M 0 380 Q 140 320 240 210 Q 340 310 520 370" fill="none" stroke="#10b981" stroke-width="2" opacity="0.7" />
    <path d="M 20 400 Q 150 345 240 250 Q 330 340 500 395" fill="none" stroke="#34d399" stroke-width="1.8" opacity="0.8" />
    <path d="M 40 420 Q 160 370 240 290 Q 320 370 480 420" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.9" />
    <path d="M 60 440 Q 170 395 240 330 Q 310 400 460 445" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.9" />
    <path d="M 80 460 Q 180 420 240 370 Q 300 430 440 470" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.9" />

    <!-- 3D Peak facets -->
    <polygon points="240,140 160,260 240,240" fill="#10b981" opacity="0.8" />
    <polygon points="240,140 320,260 240,240" fill="#059669" opacity="0.85" />
    <line x1="240" y1="140" x2="240" y2="240" stroke="#f8fafc" stroke-width="2" />

    <!-- Dendritic Stream Network -->
    <path d="M 240 240 Q 230 300 210 340 T 170 420 T 120 480" fill="none" stroke="url(#streamGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
    <path d="M 210 340 Q 260 370 290 430" fill="none" stroke="url(#streamGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 170 420 Q 210 450 230 490" fill="none" stroke="url(#streamGrad)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Peak Summit Beacon Glow -->
    <circle cx="240" cy="140" r="4" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Left Side: Brand Typography & Architecture Info -->
  <g transform="translate(100, 120)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#0b0f17" stroke="#1e293b" stroke-width="2" />
    <polygon points="30,12 14,44 30,39" fill="#10b981" />
    <polygon points="30,12 46,44 30,39" fill="#06b6d4" />
    <line x1="30" y1="12" x2="30" y2="39" stroke="#ffffff" stroke-width="1.5" />

    <!-- Brand Header -->
    <text x="76" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#brandGrad)" letter-spacing="0.08em">TERRA</text>

    <!-- Subtitle -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">
      3D Terrain &amp; Geospatial Analysis
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">
      Interactive browser-based digital elevation exploration,
    </text>
    <text x="0" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">
      hydrological routing, and real-time surface analytics.
    </text>

    <!-- Badges / Capability Highlights -->
    <g transform="translate(0, 220)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">WebGL 3D Engine</text>

      <!-- Badge 2 -->
      <rect x="195" y="0" width="190" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="207" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">Priority-Flood D8</text>

      <!-- Badge 3 -->
      <rect x="0" y="48" width="195" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">Horn Slope &amp; Relief</text>

      <!-- Badge 4 -->
      <rect x="210" y="48" width="175" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="222" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">100% Client-Side</text>
    </g>

    <!-- Bottom URL Link Badge -->
    <g transform="translate(0, 345)">
      <text x="0" y="20" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" font-weight="600" fill="#64748b">
        https://clearxheaded.github.io/terra/
      </text>
    </g>
  </g>
</svg>
