<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#161e2e" />
    </linearGradient>
    <linearGradient id="peakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="contourGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Topographic contour rings -->
  <ellipse cx="32" cy="45" rx="24" ry="11" fill="none" stroke="url(#contourGrad)" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.4" />
  <ellipse cx="32" cy="40" rx="18" ry="8" fill="none" stroke="url(#contourGrad)" stroke-width="1.3" opacity="0.6" />
  <ellipse cx="32" cy="35" rx="12" ry="5.5" fill="none" stroke="url(#contourGrad)" stroke-width="1.4" opacity="0.8" />

  <!-- 3D Mountain Peak facets -->
  <path d="M 32 12 L 14 46 L 32 41 Z" fill="url(#peakGrad)" opacity="0.95" />
  <path d="M 32 12 L 50 46 L 32 41 Z" fill="url(#peakGrad)" opacity="0.75" />

  <!-- Ridge highlights -->
  <line x1="32" y1="12" x2="32" y2="41" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />

  <!-- Peak summit beacon -->
  <circle cx="32" cy="12" r="2" fill="#f8fafc" />
</svg>
